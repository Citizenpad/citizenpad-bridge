# Recopie une fois les versions publiées du Bridge depuis l'ancien dépôt (migration du 27 nov. 2026), puis ce fichier
# est retiré. Les fichiers sont vérifiés (sha256) avant d'être publiés ici.
name: Recopier les versions
on:
  push:
    paths: ['.github/workflows/publier.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recopier:
    runs-on: ubuntu-latest
    steps:
      - name: Recopier v1.4.0, v1.5.0, v1.5.1, v1.5.2
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -e
          for t in v1.4.0 v1.5.0 v1.5.1 v1.5.2; do
            if gh release view "$t" -R "$R" >/dev/null 2>&1; then echo "$t existe déjà"; continue; fi
            mkdir -p "$t"; cd "$t"
            for f in CitizenPad-Bridge-Setup.exe CitizenPad-Bridge-Setup.exe.sha256; do
              curl -sSfL -o "$f" "https://github.com/Citizenpad/citizenpad-bridge/releases/download/$t/$f"
            done
            sha256sum -c CitizenPad-Bridge-Setup.exe.sha256
            v="${t#v}"
            latest=false; [ "$t" = v1.5.2 ] && latest=true
            gh release create "$t" -R "$R" --target main --title "CitizenPad Bridge $v" \
              --notes "Installateur Windows de CitizenPad Bridge $v. Télécharge-le depuis citizenpad.com (Réglages → Bridge)." \
              --latest=$latest CitizenPad-Bridge-Setup.exe CitizenPad-Bridge-Setup.exe.sha256
            cd ..
          done
