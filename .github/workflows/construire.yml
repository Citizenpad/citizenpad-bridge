# ═══════════════════════════════════════════════════════════════════════════
#  FABRIQUE LE BRIDGE SUR UNE MACHINE WINDOWS DE GITHUB
# ═══════════════════════════════════════════════════════════════════════════
#  À chaque envoi de code :
#    - l'installateur est fabriqué et testé ;
#    - il est déposé dans « Artifacts » de l'exécution (onglet Actions),
#      pour l'essayer sur un vrai PC avant de le publier.
#
#  Sur la branche main SEULEMENT, et si cette version n'existe pas encore :
#    - une « Release » vX.Y.Z est publiée avec l'installateur et son
#      empreinte. C'est là que le site et les Bridges vont le chercher.
#
#  Pour publier une correction : monter la version (package.json ET
#  bridge.mjs), fusionner sur main, puis mettre le même numéro dans
#  VERSION_BRIDGE du site (app/api/version/route.ts).
# ═══════════════════════════════════════════════════════════════════════════
name: Construire le Bridge

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      # ── NOA sur le PC ────────────────────────────────────────────────────
      # libvosk.dll : la bibliothèque officielle de Vosk, prise dans son
      # paquet Python pour Windows (le même fichier, sans Python).
      - name: NOA — Vosk (libvosk.dll)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'vosk'
          python -m pip download vosk==0.3.45 --platform win_amd64 --only-binary=:all: --no-deps -d $t
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $whl = Get-ChildItem $t -Filter *.whl | Select-Object -First 1
          Copy-Item $whl.FullName "$t\vosk.zip"
          Expand-Archive "$t\vosk.zip" -DestinationPath "$t\x" -Force
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item "$t\x\vosk\*.dll" vendor\
          # Le moteur C++ de Windows, posé à côté (aucune installation à faire
          # chez le joueur, même s'il n'a jamais installé « Visual C++ »).
          foreach ($f in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') { Copy-Item "$env:WINDIR\System32\$f" vendor\ }
          Get-ChildItem vendor | Select-Object Name, Length

      # Whisper (whisper.cpp) compilé ici, deux fois : avec la carte graphique
      # (Vulkan : NVIDIA, AMD, Intel) et pour le processeur seul. Long la
      # première fois (~15 min), puis gardé en cache.
      - name: NOA — Whisper (cache)
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: vendor-whisper
          key: whisper-v1.9.5-vulkan-cpu-r1

      - name: NOA — SDK Vulkan
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: NOA — Whisper (compilation)
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'whisper.cpp'
          git clone --quiet --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp $src
          $commun = @('-DBUILD_SHARED_LIBS=OFF', '-DWHISPER_BUILD_TESTS=OFF', '-DWHISPER_BUILD_EXAMPLES=ON', '-DWHISPER_BUILD_SERVER=ON',
                      '-DWHISPER_SDL2=OFF', '-DGGML_NATIVE=OFF', '-DCMAKE_POLICY_DEFAULT_CMP0091=NEW', '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded')
          cmake -S $src -B "$src\b-cpu" @commun
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build "$src\b-cpu" --config Release --target whisper-server -j 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake -S $src -B "$src\b-vk" @commun -DGGML_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build "$src\b-vk" --config Release --target whisper-server -j 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force vendor-whisper | Out-Null
          Copy-Item "$src\b-cpu\bin\Release\whisper-server.exe" vendor-whisper\whisper-server.exe
          Copy-Item "$src\b-vk\bin\Release\whisper-server.exe" vendor-whisper\whisper-server-vulkan.exe
          Get-ChildItem vendor-whisper | Select-Object Name, Length

      - name: Exécutables (aide C# + Node SEA)
        run: npm run fabriquer

      - name: NOA — les oreilles démarrent-elles ?
        run: node build/tester-voix.mjs

      - name: La fenêtre répond-elle au Bridge ?
        run: node build/tester-fenetre.mjs

      - name: L'exécutable démarre-t-il ?
        shell: pwsh
        run: |
          $sortie = (& dist\CitizenPad-Bridge.exe --version | Out-String).Trim()
          $attendue = (Get-Content dist\version.txt).Trim()
          Write-Host "Réponse : '$sortie' (attendue : '$attendue')"
          if ($sortie -ne $attendue) { exit 1 }

      - name: Essai réel (fenêtre, 15 secondes)
        shell: pwsh
        run: ./build/essai-reel.ps1

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (Get-Content dist\version.txt).Trim()
          & $iscc "/DVersion=$v" build\installateur.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $h = (Get-FileHash dist\CitizenPad-Bridge-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\CitizenPad-Bridge-Setup.exe.sha256", "$h  CitizenPad-Bridge-Setup.exe")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item dist\CitizenPad-Bridge-Setup.exe | Select-Object Name, Length

      - name: Paquet Microsoft Store (MSIX)
        shell: pwsh
        run: ./build/msix/fabriquer-msix.ps1

      - name: Dépôt du paquet Store (à envoyer dans Partner Center)
        uses: actions/upload-artifact@v4
        with:
          name: CitizenPad-Bridge-${{ env.VERSION }}-Store-MSIX
          path: dist/CitizenPad-Bridge-${{ env.VERSION }}.msix

      - name: Dépôt pour essai
        uses: actions/upload-artifact@v4
        with:
          name: CitizenPad-Bridge-${{ env.VERSION }}-${{ github.ref_name }}
          path: |
            dist/CitizenPad-Bridge-Setup.exe
            dist/CitizenPad-Bridge-Setup.exe.sha256

      - name: Publication (main uniquement)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$env:VERSION existe déjà : rien à publier."; exit 0 }
          gh release create "v$env:VERSION" `
            dist/CitizenPad-Bridge-Setup.exe `
            dist/CitizenPad-Bridge-Setup.exe.sha256 `
            --title "CitizenPad Bridge $env:VERSION" `
            --notes "Installateur Windows de CitizenPad Bridge $env:VERSION. Télécharge-le depuis citizenpad.com (Réglages → Bridge)."
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Capture d'écran sur la branche « captures »
        if: always() && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          if (-not (Test-Path captures\fenetre.png)) { exit 0 }
          git config user.name "github-actions"; git config user.email "actions@github.com"
          $f = "fenetre-$env:GITHUB_RUN_ID.png"
          Copy-Item captures\fenetre.png "$env:RUNNER_TEMP\$f"
          git fetch origin captures 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -B captures origin/captures } else { git checkout --orphan captures; git rm -rf --quiet . }
          Copy-Item "$env:RUNNER_TEMP\$f" $f
          git add $f; git commit -m "Capture $env:GITHUB_RUN_ID" --quiet; git push origin captures --quiet
